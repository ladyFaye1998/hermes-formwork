[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-formwork"
version = "0.1.0"
description = "Source-backed PDF packet review for Hermes Agent"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6.19,<7",
  "pypdfium2>=4.30,<6",
  "Pillow>=10,<14",
  "fastapi>=0.115,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "reportlab>=4,<5", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["formwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
